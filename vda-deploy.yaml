      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    networks:
      - vda
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


